# logd configuration for containers.
# Baked into the image at /etc/logd/config.yaml. Override by bind-mounting your own file
# over that path (see docker-compose.yml), or point -config elsewhere.

port: 7100
data_dir: /data                 # persist on a Docker volume, NOT the container layer
segment_size_mb: 64
flush_interval_ms: 500
# Group commit: how long a written page may sit unsynced. fsync is the write path's entire
# bottleneck — per-page fsync measures ~21k lines/s, 50ms measures ~1.05M. A crash risks at
# most this much accepted data; nothing becomes corrupt (a partial page is CRC-caught and
# truncated on recovery). Negative = fsync every page.
sync_interval_ms: 50
# Sealed segments are compressed into blocks of this many 4KB pages (the active segment
# stays raw). Bigger blocks compress better but decompress more per random lookup: measured
# on real log text, 4.1x per single page, 6.2x at 8, 6.5x at 16, 6.9x whole-file.
# Negative disables compression.
compress_block_pages: 8
retention_days: 30              # delete sealed segments older than this (0 = keep forever)
index_mem_budget_mb: 256        # seal a segment early if its in-RAM index exceeds this
shards: 1                       # shared-nothing writer folders; queries fan in across them
max_label_values_per_key: 1000  # cardinality cap (over-cap values stay scannable in Extra)
multitenancy: false             # set true to isolate data by the X-Scope-OrgID header

# Template extraction — declares fields you can RANGE-query in LogQL, e.g.
#   {app="api"} | latency_ms > 200
# Add your own; the field name is "<template>_<capture>".
index:
  templates:
    - name: latency
      pattern: "took {ms:int}ms"

# Label allowlist — which pushed stream labels get INDEXED for fast {k="v"} filters.
# Labels not listed still work (found by scan); listed ones are index-accelerated.
labels: [region, env, app, namespace, pod, container]
