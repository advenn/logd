# Single-binary, filesystem-backed Loki for the head-to-head comparison.
#
# Several settings below deviate from Loki's defaults. Every one of them is here to make
# the comparison FAIR rather than to make Loki look bad, and each is disclosed in the
# generated report. Read the comments before changing any of them — most of these defaults
# would silently corrupt the numbers rather than produce an obvious error.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  grpc_server_max_recv_msg_size: 33554432
  grpc_server_max_send_msg_size: 33554432

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    # A CACHE, not stored data. The disk-usage figure excludes this directory, because
    # counting a re-downloadable cache as Loki's storage cost would overstate it.
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  retention_enabled: false
  delete_request_store: filesystem

limits_config:
  # Raised from the defaults of 4 MB / 6 MB. Left alone, the load generator gets 429s and
  # logd "wins" on ingest throughput because Loki was CONFIG-limited, not capability-
  # limited. That would be a meaningless result, so the harness treats any 429 as fatal.
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  per_stream_rate_limit: 128MB
  per_stream_rate_limit_burst: 256MB
  max_streams_per_user: 0
  max_global_streams_per_user: 0

  # The corpus replays fixed historical timestamps (base 2026-01-01) so runs are
  # reproducible. With the defaults, Loki would silently DROP all of it as too old.
  reject_old_samples: false
  reject_old_samples_max_age: 8760h

  # Default is 5000. A parity query expecting ~55k rows would come back truncated, which
  # looks exactly like Loki losing data when in fact the harness asked for too much.
  max_entries_limit_per_query: 2000000
  max_query_length: 0h
  max_query_lookback: 0s
  max_query_parallelism: 32
  max_query_series: 100000
  volume_enabled: true

  # Loki 3.x synthesises a `service_name` label and `detected_level` structured metadata
  # that neither logd nor VictoriaLogs produce. Left on, label-set parity fails for a
  # reason that has nothing to do with either engine's storage or query design.
  discover_service_name: []
  discover_log_levels: false

query_range:
  # OFF for the measured runs. With caching on, runs 2..N measure the result cache rather
  # than the engine. A cache-enabled figure is collected separately and reported as Loki's
  # real-world best case, which is the honest way to present it.
  cache_results: false
  align_queries_with_step: false
  parallelise_shardable_queries: true

querier:
  max_concurrent: 8

frontend:
  log_queries_longer_than: 0s

pattern_ingester:
  enabled: false

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
