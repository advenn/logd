# PostgreSQL 17 for the head-to-head testbed (experiment E-3).
#
# The question this baseline answers is "why not just use PostgreSQL with an extracted column
# and a B-tree index?", so it has to be configured the way a competent DBA would configure a
# small dedicated box, not left at defaults that assume a 1990s laptop, and not tuned into
# something nobody runs. The container gets the same 2 CPUs / 3 GB as every other backend.
#
# This file REPLACES postgresql.conf (passed as config_file), so anything not set here is the
# compiled-in default. Every line below is a deviation from that default and says why.
# Durability is deliberately NOT relaxed: fsync, synchronous_commit, full_page_writes and
# wal_level all stay at their defaults, so a commit is on disk when COPY returns. That makes
# PostgreSQL the most durable engine in the comparison (logd acknowledges at enqueue and
# group-commits every 50 ms; Loki and VictoriaLogs acknowledge from memory), and the ingest
# figures must be read with that in mind.

# The compiled-in default is 'localhost', which would make the server unreachable from the
# shim and the loader. The official image's own sample config sets the same value.
listen_addresses = '*'

# Memory: 25% of the 3 GB container limit, the standard starting point. The rest is left to
# the OS page cache, which in a cgroup-limited container is charged to the same 3 GB. The
# default (128 MB) is smaller than the HDFS replay's table (379 MB of heap), so every scan of
# it would copy each page in from the OS page cache again and look slower than it is.
shared_buffers = 768MB

# A planner hint, not an allocation: how much of the data the planner may assume is cached
# (shared_buffers + OS cache). The default of 4 GB claims more memory than the container has.
effective_cache_size = 2GB

# Per sort/hash node. At the default 4 MB the 5.4%-selectivity query (27k rows, ~4 MB of
# line text) spills its ORDER BY to a temp file; 32 MB keeps every query in this testbed in
# memory. Safe here because the workload is a handful of concurrent analytical queries, not
# hundreds of OLTP connections each allowed this much per node.
work_mem = 32MB

# Index builds and VACUUM after the bulk load. Default 64 MB.
maintenance_work_mem = 256MB

# The data volume sits on NVMe. The default random_page_cost of 4.0 models spinning disks and
# biases the planner against index scans that are, on this hardware, nearly as cheap as
# sequential reads; 1.1 is the usual SSD setting. effective_io_concurrency (default 1) lets
# bitmap heap scans prefetch, which is what the range-index path uses.
random_page_cost = 1.1
effective_io_concurrency = 200

# Fewer, larger checkpoints during the bulk load. A checkpoint is requested after roughly
# max_wal_size / (1 + checkpoint_completion_target) of WAL -- ~530 MB at the 1 GB default --
# and the structured HDFS load alone writes 513 MB, so the default would land checkpoints,
# and the full-page images that follow them, in the middle of a load. 2 GB is a conservative
# value for a dedicated box (PGTune suggests 4 GB for analytical loads). WAL
# is not counted in the disk figures, which are pg_total_relation_size (heap + TOAST + indexes
# + FSM/VM); the loader reports WAL bytes written separately.
max_wal_size = 2GB

# Left at their defaults, and named here only because a reader will ask:
#   synchronous_commit = on, fsync = on, full_page_writes = on, wal_level = replica
#   max_parallel_workers_per_gather = 2 (leader + 2 workers saturate the 2-CPU quota on a scan)
#   jit = on (PostgreSQL's default). It never fires on the measured queries: the costliest
#     plan, the HDFS unstructured scan over 2M rows, is costed at ~98k, just under
#     jit_above_cost (100k). A larger replay would cross it; check EXPLAIN for a JIT section.
#   autovacuum = on (the loader runs VACUUM (ANALYZE) itself, so nothing is pending afterwards)
